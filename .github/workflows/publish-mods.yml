name: Publicar catalogo de mods

# Gera um ZIP por mod (build_mod_catalog.py) e publica os arquivos como
# assets da release de tag fixa "mods-latest". O instalador le essa release
# via API do GitHub e baixa cada ZIP por HTTPS (sem Google Drive / sem cota).

on:
  # Roda sozinho quando os mods mudam na branch principal.
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "build_mod_catalog.py"
      - ".github/workflows/publish-mods.yml"
  # Permite disparar manualmente pela aba Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mods
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar catalogo de mods (um ZIP por mod)
        run: python build_mod_catalog.py

      - name: Publicar ZIPs na release mods-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recria a release do zero para nao deixar assets de mods removidos.
          gh release delete mods-latest --yes --cleanup-tag || true
          gh release create mods-latest \
            --title "Catalogo de mods" \
            --notes "Atualizado automaticamente pelo workflow publish-mods." \
            --latest=false \
            dist/mod_catalog/*.zip
